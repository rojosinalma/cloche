name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that cloche does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A share option, a viewer, a form field type, a setting, an MCP tool…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Gallery / previews
        - Text or 3D viewer
        - Forms
        - Zip downloads
        - REST API
        - MCP server
        - Callbacks into opencode
        - Docker / deployment
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: Shared files stay read-only; cloche never writes to the host tree.
        - label: I searched existing issues.
